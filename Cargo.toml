[package]
name = "cargo-deadlinks"
description = "Cargo subcommand for checking your documentation for broken links"
version = "0.8.1"
authors = ["Maximilian Goisser <goisser94@gmail.com>", "Joshua Nelson <jyn514@gmail.com"]
edition = "2024"
repository = "https://github.com/deadlinks/cargo-deadlinks"
readme = "README.md"
license = "MIT OR Apache-2.0"
autobins = false
default-run = "deadlinks"

[[bin]]
name = "cargo-deadlinks"
required-features = ["cargo"]

[[bin]]
name = "deadlinks"

[features]
cargo = ["cargo_metadata", "serde_json"]
default = ["cargo"]

[dependencies]
cached = { version = "0.56.0", default-features = false }
cargo_metadata = { version = "0.23", optional = true }
serde_json = { version = "1.0.149", optional = true }
pico-args = "0.5"
env_logger = "0.11"
lol_html = "2.7"
log = "0.4"
num_cpus = "1.17"
once_cell = "1.21.3"
rayon = "1.11"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
ureq = { version = "3.2.0", features = ["rustls"], default-features = false }
serde = "1.0"
serde_derive = "1.0"
url = "2"
# Try to keep this in sync with `url`'s version
percent-encoding = "2"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.1"
predicates = "3.1.3"
mockito = "1.7.2"
